<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <!-- resizes-content keeps the bottom add bar above the on-screen keyboard. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ede6d6" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;700;900&family=Chivo+Mono&display=swap"
      rel="stylesheet"
    />
    <!-- Linked here rather than imported by the app, so the splash below is
         styled from its first paint. -->
    <link rel="stylesheet" href="/src/index.css" />
    <title>Daico</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- The splash: the login screen without its button, painted before any
         script runs and shown until the app has drawn a screen of its own.
         Its frame is the login screen's, so either takes over from it with
         nothing moving: the mark at the screen's centre, where an installed
         app's system splash draws it, the rest hanging below. -->
    <div
      id="splash"
      class="grid min-h-dvh grid-rows-[1fr_auto_1fr] justify-items-center bg-surface text-on-surface"
    >
      <img
        src="/pwa-512x512.png"
        alt=""
        class="row-start-2 h-30 w-30 outline -outline-offset-1 outline-border"
      />
      <div class="row-start-3 flex w-full flex-col items-center px-4 pt-5 text-center">
        <div class="flex w-full max-w-sm flex-col items-center">
          <p class="mb-1.5 font-display text-5xl font-black tracking-tight">daico</p>
          <p class="mb-10 text-muted">Todo en orden, en un solo lugar.</p>
          <div class="flex h-12 w-full flex-col justify-center">
            <span role="status" aria-label="Cargando" class="block h-0.5 overflow-hidden bg-border">
              <span class="block h-full w-1/3 animate-sweep bg-on-surface"></span>
            </span>
          </div>
          <p class="mt-4 animate-late-hint text-sm text-muted">Está tardando más de lo normal.</p>
          <a href="" class="mt-3 animate-late-hint text-muted underline">Recargar</a>
        </div>
        <footer class="mt-auto flex flex-col items-center gap-2 py-8 text-xs text-muted">
          <div class="flex gap-4">
            <a href="/privacy/" class="underline">Política de Privacidad</a>
            <a href="/terms/" class="underline">Términos de Servicio</a>
          </div>
          <p>Hecho con 💚</p>
        </footer>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
